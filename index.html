<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diego</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0d0f;
    --line: #22252b;
    --accent: #00e5a0;
    --text: #e9ecef;
    --text-dim: #8b929c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh 6vw;
  }

  .wrap {
    width: 100%;
    max-width: 560px;
    text-align: left;
  }

  .eyebrow {
    color: var(--accent);
    font-size: 0.85rem;
    letter-spacing: 0.02em;
    margin: 0 0 0.6rem 0;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(2rem, 5.5vw, 3rem);
    line-height: 1.1;
    margin: 0 0 1.4rem 0;
    letter-spacing: -0.01em;
  }

  .wrap p {
    color: var(--text-dim);
    font-size: 0.95rem;
    line-height: 1.7;
    max-width: 46ch;
    margin: 0 0 1.4rem 0;
  }

  .barra {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.9rem 1.1rem;
    margin: 1.8rem 0;
    color: var(--text-dim);
    font-size: 0.9rem;
  }

  .barra .prompt {
    color: var(--accent);
  }

  .barra .cursor {
    display: inline-block;
    width: 7px;
    height: 1em;
    background: var(--accent);
    animation: blink 1s step-end infinite;
    vertical-align: middle;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  footer {
    margin-top: 2.4rem;
    color: var(--text-dim);
    font-size: 0.75rem;
  }

  footer a {
    color: var(--text-dim);
  }

  @media (prefers-reduced-motion: reduce) {
    .barra .cursor { animation: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">dmadcham.github.io</p>
    <h1>No hay nada que ver aquí.</h1>
    <p>Este dominio aloja varios proyectos, pero ninguno está listado. Si sabes dónde vive el que buscas, escribe su ruta directamente en la barra de direcciones.</p>

    <div class="barra">
      <span class="prompt">dmadcham.github.io/</span><span class="cursor"></span>
    </div>

    <footer>
      <a href="https://github.com/dmadcham">github.com/dmadcham</a>
    </footer>
  </div>
</body>
</html>
